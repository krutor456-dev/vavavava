<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Егор красавчик</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .heart {
      width: 110px;
      height: 110px;
      fill: #ffb6c1;
      animation: heartbeat 1.6s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: lowercase;
    }
    .c-red    { color: #ff3b30; }
    .c-orange { color: #ff9500; }
    .c-yellow { color: #ffd60a; }
    .c-green  { color: #34c759; }
    .c-cyan   { color: #30d158; }
    .c-blue   { color: #00c7be; }
    .c-azure  { color: #32ade6; }
    .c-violet { color: #af52de; }
    .c-magenta{ color: #ff2d55; }
  </style>
</head>
<body>
  <div class="container">
    <svg class="heart" viewBox="0 0 24 24">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
    <h1 class="title">
      <span class="c-red">е</span><span class="c-orange">г</span><span class="c-yellow">о</span><span class="c-green">р</span>
      &nbsp;
      <span class="c-blue">к</span><span class="c-azure">р</span><span class="c-violet">а</span><span class="c-magenta">с</span><span class="c-red">а</span><span class="c-orange">в</span><span class="c-yellow">ч</span><span class="c-green">и</span><span class="c-blue">к</span>
    </h1>
  </div>
  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
