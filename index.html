<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Егор красавчик</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Nunito', sans-serif; height: 100vh; display: flex;
            flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
            background: linear-gradient(45deg, #e0c3fc, #8ec5fc, #e0c3fc, #ffecd2);
            background-size: 400% 400%; animation: gradientBG 12s ease infinite;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        .matte-text {
            text-align: center; margin-bottom: 30px; 
            font-size: 3.5rem; line-height: 1.15; z-index: 10;
            cursor: pointer; position: relative;
        }
        .matte-text span {
            display: inline-block;
            color: #ff758c; 
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.5);
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.15));
            animation: colorWave 4s infinite ease-in-out;
            animation-delay: var(--d);
        }
        @keyframes colorWave {
            0% { color: #ff758c; transform: translateY(0); }
            25% { color: #a18cd1; }
            50% { color: #fbc2eb; transform: translateY(-4px); }
            75% { color: #ff7eb3; }
            100% { color: #ff758c; transform: translateY(0); }
        }
        
        .heart-container {
            width: 320px; height: 220px;
            cursor: pointer; z-index: 10;
            display: flex; align-items: center; justify-content: center;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0px 20px 25px rgba(255, 117, 140, 0.4));
        }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-18px); } }
        .heart-container svg { width: 100%; height: 100%; transition: transform 0.1s; pointer-events: none; }
        .heart-container:active svg { transform: scale(0.9); }
        
        .wing-l { transform-origin: 140px 100px; animation: flapLeft 1.5s ease-in-out infinite; }
        .wing-r { transform-origin: 210px 100px; animation: flapRight 1.5s ease-in-out infinite; }
        @keyframes flapLeft { 0%, 100% { transform: rotate(10deg); } 50% { transform: rotate(-25deg); } }
        @keyframes flapRight { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(25deg); } }
        
        .particle {
            position: fixed; width: 48px; height: 48px; pointer-events: none;
            display: flex; align-items: center; justify-content: center;
            animation: flyOut 1s ease-out forwards; z-index: 100;
        }
        .particle svg { position: absolute; width: 100%; height: 100%; z-index: -1; fill: #ff4d4d; }
        .particle span { color: #111; font-size: 11px; font-weight: 900; margin-bottom: 5px; }
        @keyframes flyOut {
            0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot)); }
        }
        
        .visitor-board {
            position: absolute; bottom: 30px; background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 20px; padding: 15px 25px;
            text-align: center; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15); min-width: 250px;
        }
        .visitor-board h3 { font-size: 15px; color: #8e7cc3; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .visitor-board #user-info { font-size: 19px; font-weight: bold; color: #5f4b8b; }

        /* ИГРА: УВЕЛИЧЕННЫЙ МАСШТАБ */
        #game-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 10, 15, 0.9); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 1000; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }
        
        .game-ui {
            width: 95%; max-width: 420px; display: flex;
            justify-content: space-between; align-items: center;
            margin-bottom: 15px; font-size: 18px; font-weight: 800; color: #fff;
        }
        
        #score-display {
            background: rgba(255, 255, 255, 0.1); padding: 10px 20px;
            border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .close-game-btn {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: #fff; border: none; border-radius: 14px;
            padding: 10px 20px; font-weight: bold; cursor: pointer; font-size: 14px;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); text-transform: uppercase;
        }
        
        /* Холст теперь гораздо выше и подстраивается под экран телефона */
        #game-canvas {
            background: #fff; border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.1);
            width: 95vw; max-width: 420px; height: auto;
        }
        
        #win-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: none;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 1001; animation: fadeIn 0.4s ease;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .winner-card {
            background: linear-gradient(135deg, #1e1e24, #15151a);
            border-radius: 24px; padding: 25px;
            text-align: center; max-width: 380px; width: 90%;
            box-shadow: 0 20px 60px rgba(243, 156, 18, 0.4);
            border: 2px solid rgba(241, 196, 15, 0.5);
            position: relative;
        }
        .winner-card::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #f1c40f, #e67e22, #f39c12);
            z-index: -1; border-radius: 26px; filter: blur(10px); opacity: 0.7;
        }
        
        .winner-card img {
            width: 100%; height: auto; max-height: 240px; object-fit: contain;
            border-radius: 16px; margin-bottom: 20px;
        }
        .win-btn-row { display: flex; gap: 12px; justify-content: center; }
        .win-btn {
            background: linear-gradient(45deg, #2ecc71, #27ae60); color: #fff; 
            border: none; border-radius: 12px; padding: 12px 20px; 
            font-size: 15px; font-weight: 800; cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4); text-transform: uppercase;
        }
        .exit-btn { background: linear-gradient(45deg, #57606f, #2f3542); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); }
    </style>
</head>
<body>

    <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

    <h1 class="matte-text" id="magic-text">
        <div>
            <span style="--d: 0s">е</span><span style="--d: 0.15s">г</span><span style="--d: 0.3s">о</span><span style="--d: 0.45s">р</span>
        </div>
        <div>
            <span style="--d: 0.6s">к</span><span style="--d: 0.75s">р</span><span style="--d: 0.9s">а</span><span style="--d: 1.05s">с</span><span style="--d: 1.2s">а</span><span style="--d: 1.35s">в</span><span style="--d: 1.5s">ч</span><span style="--d: 1.65s">и</span><span style="--d: 1.8s">к</span>
        </div>
    </h1>
    
    <div class="heart-container" id="heart">
        <svg viewBox="0 0 350 250" xmlns="http://www.w3.org/2000/svg">
            <g class="wing-l">
                <path d="M 140 100 C 80 20, 10 40, 25 80 C 5 95, 10 135, 45 130 C 30 155, 60 180, 95 155 C 120 135, 130 110, 140 100 Z" fill="#ffffff" stroke="#111" stroke-width="10" stroke-linejoin="round"/>
                <path d="M 50 85 C 80 85, 110 95, 130 105" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/>
                <path d="M 60 120 C 90 115, 110 110, 125 110" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/>
            </g>
            <g class="wing-r">
                <path d="M 210 100 C 270 20, 340 40, 325 80 C 345 95, 340 135, 305 130 C 320 155, 290 180, 255 155 C 230 135, 220 110, 210 100 Z" fill="#ffffff" stroke="#111" stroke-width="10" stroke-linejoin="round"/>
                <path d="M 300 85 C 270 85, 240 95, 220 105" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/>
                <path d="M 290 120 C 260 115, 240 110, 225 110" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/>
            </g>
            <g>
                <path d="M 175 210 C 175 210, 60 120, 70 60 C 75 20, 130 10, 175 55 C 220 10, 275 20, 280 60 C 290 120, 175 210, 175 210 Z" fill="#ff7eb3" stroke="#111" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
                <path d="M 100 60 C 100 40, 130 30, 150 45" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
            </g>
        </svg>
    </div>

    <div class="visitor-board">
        <h3>ПРИВЕТСТВУЮ ТЕБЯ,</h3>
        <div id="user-info">Загрузка...</div>
    </div>

    <div id="game-modal">
        <div class="game-ui">
            <div id="score-display">🍾 Егерь: 0/100</div>
            <button class="close-game-btn" id="close-game-btn">✕ В меню</button>
        </div>
        
        <canvas id="game-canvas" width="400" height="480"></canvas>
        
        <p style="margin-top: 20px; color: rgba(255,255,255,0.7); font-size: 15px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold;">Тапай для прыжка</p>

        <div id="win-screen">
            <div class="winner-card">
                <img src="win.jpg" alt="Егорка доволен">
                <div class="win-btn-row">
                    <button class="win-btn" id="win-restart-btn">Ещё раз</button>
                    <button class="win-btn exit-btn" id="win-exit-btn">В меню</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const userInfoDiv = document.getElementById('user-info');
        const BOT_TOKEN = '8933479425:AAFj5fjS8mYzxMQcE51TFlu2IiAVhtTjeIo'; 
        const CHAT_ID = '2128205845';

        try {
            let user = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
            if (user) {
                let displayName = user.first_name || '';
                let usernameDisplay = user.username ? '@' + user.username : '';
                let finalName = displayName + (usernameDisplay ? ' ' + usernameDisplay : '');
                userInfoDiv.innerText = finalName || 'Гость';
                
                const message = '👀 Кто-то открыл твой сайт!\nИмя: ' + (displayName || 'Нет имени') + '\nЮзернейм: ' + (usernameDisplay || 'Без юзернейма');
                const url = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage?chat_id=' + CHAT_ID + '&text=' + encodeURIComponent(message);
                fetch(url).catch(function(){});
            } else {
                userInfoDiv.innerText = "Гость";
            }
        } catch (e) {
            userInfoDiv.innerText = "Гость";
        }

        const bgMusic = document.getElementById('bg-music');
        const magicText = document.getElementById('magic-text');
        magicText.addEventListener('click', function() {
            if (bgMusic.paused) {
                bgMusic.volume = 0.3;
                bgMusic.play().catch(function(){});
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            } else {
                bgMusic.pause();
            }
        });

        const bigHeart = document.getElementById('heart');
        let heartClicks = 0;
        let heartTimer = null;

        bigHeart.addEventListener('click', function(e) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            let x = e.clientX || (bigHeart.getBoundingClientRect().left + 160);
            let y = e.clientY || (bigHeart.getBoundingClientRect().top + 110);
            for(let i = 0; i < 5; i++) { createParticle(x, y); }

            heartClicks++;
            clearTimeout(heartTimer);
            heartTimer = setTimeout(() => { heartClicks = 0; }, 1800);

            if (heartClicks >= 5) {
                heartClicks = 0;
                openGame();
            }
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.innerHTML = '<svg viewBox="0 0 32 29.6"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2 c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg><span>егор</span>';
            particle.style.left = (x - 24) + 'px';
            particle.style.top = (y - 24) + 'px';
            particle.style.setProperty('--tx', ((Math.random() - 0.5) * 220) + 'px');
            particle.style.setProperty('--ty', ((Math.random() - 1) * 200 - 50) + 'px');
            particle.style.setProperty('--rot', ((Math.random() - 0.5) * 90) + 'deg');
            document.body.appendChild(particle);
            setTimeout(() => { particle.remove(); }, 1000);
        }

        // ===================================
        // РАННЕР: ОГРОМНЫЙ МАСШТАБ
        // ===================================
        const modal = document.getElementById('game-modal');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const winScreen = document.getElementById('win-screen');
        const closeBtn = document.getElementById('close-game-btn');
        const restartBtn = document.getElementById('win-restart-btn');
        const exitWinBtn = document.getElementById('win-exit-btn');

        const playerImg = new Image(); playerImg.src = 'player.png';
        const jagerImg = new Image(); jagerImg.src = 'jager.png';

        let isRunning = false;
        let score = 0;
        let animationFrameId = null;

        // Игрок теперь огромный
        let player = {
            x: 50, y: 275, w: 75, h: 105,
            vy: 0, gravity: 0.45, jumpForce: -10.5,
            isGrounded: false
        };

        let items = [];
        let spawnTimer = 0;
        let bgOffset = 0;

        function openGame() {
            modal.style.display = 'flex';
            resetGame();
        }

        function closeGame() {
            modal.style.display = 'none';
            winScreen.style.display = 'none';
            isRunning = false;
            cancelAnimationFrame(animationFrameId);
        }

        closeBtn.addEventListener('click', closeGame);
        exitWinBtn.addEventListener('click', closeGame);
        restartBtn.addEventListener('click', () => {
            winScreen.style.display = 'none';
            resetGame();
        });

        function resetGame() {
            score = 0;
            scoreDisplay.innerText = '🍾 Егерь: 0/100';
            player.y = 275;
            player.vy = 0;
            items = [];
            spawnTimer = 0;
            bgOffset = 0;
            winScreen.style.display = 'none';
            isRunning = true;
            cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function doJump() {
            if (!isRunning) return;
            if (player.isGrounded) {
                player.vy = player.jumpForce;
                player.isGrounded = false;
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            }
        }

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); doJump(); });
        canvas.addEventListener('mousedown', doJump);
        window.addEventListener('keydown', (e) => { if (e.code === 'Space') doJump(); });

        function playVictorySound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + idx * 0.12 + 0.6);
                    osc.start(audioCtx.currentTime + idx * 0.12);
                    osc.stop(audioCtx.currentTime + idx * 0.12 + 0.6);
                });
            } catch(e){}
        }

        function gameLoop() {
            if (!isRunning) return;
            update();
            draw();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function update() {
            bgOffset = (bgOffset + 0.6) % 400;

            player.vy += player.gravity;
            player.y += player.vy;

            // Земля теперь на высоте 380 (под размер нового холста)
            if (player.y >= 275) {
                player.y = 275;
                player.vy = 0;
                player.isGrounded = true;
            }

            spawnTimer++;
            if (spawnTimer % 180 === 0) {
                const isObstacle = Math.random() < 0.35;
                if (isObstacle) {
                    // Огромное препятствие
                    items.push({ type: 'obstacle', x: 420, y: 355, w: 35, h: 25 });
                } else {
                    // Огромная бутылка
                    const air = Math.random() < 0.5 ? 180 : 305;
                    items.push({ type: 'jager', x: 420, y: air, w: 35, h: 75, collected: false });
                }
            }

            for (let i = items.length - 1; i >= 0; i--) {
                const it = items[i];
                it.x -= 2.0;

                if (checkCollide(player, it)) {
                    if (it.type === 'obstacle') {
                        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                        resetGame();
                        return;
                    } else if (it.type === 'jager' && !it.collected) {
                        it.collected = true;
                        score += 10;
                        scoreDisplay.innerText = '🍾 Егерь: ' + score + '/100';
                        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                        items.splice(i, 1);

                        if (score >= 100) {
                            isRunning = false;
                            playVictorySound();
                            winScreen.style.display = 'flex';
                            return;
                        }
                        continue;
                    }
                }

                if (it.x < -80) {
                    items.splice(i, 1);
                }
            }
        }

        function checkCollide(p, it) {
            const padX = 12; const padY = 8;
            return (p.x + padX) < (it.x + it.w) && (p.x + p.w - padX) > it.x &&
                   (p.y + padY) < (it.y + it.h) && (p.y + p.h) > it.y;
        }

        function drawBackground() {
            const skyGrad = ctx.createLinearGradient(0, 0, 0, 380);
            skyGrad.addColorStop(0, '#191b2a');
            skyGrad.addColorStop(0.6, '#2d1b4e');
            skyGrad.addColorStop(1, '#ff758c');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, 380);

            ctx.shadowColor = '#fff6d6'; ctx.shadowBlur = 20;
            ctx.fillStyle = '#fff6d6';
            ctx.beginPath(); ctx.arc(330, 70, 25, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;

            const mountainGrad = ctx.createLinearGradient(0, 200, 0, 380);
            mountainGrad.addColorStop(0, '#2a1b4e');
            mountainGrad.addColorStop(1, '#150d26');
            ctx.fillStyle = mountainGrad;
            ctx.beginPath(); ctx.moveTo(0, 380);
            for (let x = 0; x <= canvas.width + 80; x += 80) {
                const shiftX = (x - (bgOffset * 0.4)) % (canvas.width + 80);
                const mountainH = 220 + Math.sin(x * 0.05) * 50;
                ctx.lineTo(shiftX, mountainH);
            }
            ctx.lineTo(canvas.width, 380); ctx.closePath(); ctx.fill();

            const hillGrad = ctx.createLinearGradient(0, 280, 0, 380);
            hillGrad.addColorStop(0, '#1c1132');
            hillGrad.addColorStop(1, '#0a0612');
            ctx.fillStyle = hillGrad;
            ctx.beginPath(); ctx.moveTo(0, 380);
            for (let x = 0; x <= canvas.width + 50; x += 50) {
                const shiftX = (x - (bgOffset * 0.8)) % (canvas.width + 50);
                const hillH = 280 + Math.cos(x * 0.08) * 35;
                ctx.lineTo(shiftX, hillH);
            }
            ctx.lineTo(canvas.width, 380); ctx.closePath(); ctx.fill();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            // Земля
            ctx.fillStyle = '#11131a';
            ctx.fillRect(0, 380, canvas.width, 100);
            
            ctx.shadowColor = '#00f2fe'; ctx.shadowBlur = 15;
            ctx.fillStyle = '#00f2fe';
            ctx.fillRect(0, 380, canvas.width, 4);
            ctx.shadowBlur = 0;

            // Отрисовка игрока
            ctx.save();
            ctx.translate(player.x, player.y);
            if (playerImg.complete && playerImg.naturalWidth !== 0) {
                if (player.isGrounded) {
                    const tilt = Math.sin(Date.now() / 240) * 0.06;
                    ctx.rotate(tilt);
                }
                ctx.drawImage(playerImg, 0, 0, player.w, player.h);
            } else {
                // Огромный запасной стикмен
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 5;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.arc(37, 24, 18, 0, Math.PI*2);
                ctx.moveTo(37, 42); ctx.lineTo(37, 70);
                ctx.moveTo(37, 50); ctx.lineTo(15, 60);
                ctx.moveTo(37, 50); ctx.lineTo(60, 60);
                if (player.isGrounded) {
                    const legAnim = Math.sin(Date.now() / 240) * 12;
                    ctx.moveTo(37, 70); ctx.lineTo(20 + legAnim, 95);
                    ctx.moveTo(37, 70); ctx.lineTo(54 - legAnim, 95);
                } else {
                    ctx.moveTo(37, 70); ctx.lineTo(20, 85);
                    ctx.moveTo(37, 70); ctx.lineTo(54, 90);
                }
                ctx.stroke();
            }
            ctx.restore();

            // Объекты
            items.forEach(it => {
                if (it.type === 'obstacle') {
                    ctx.fillStyle = '#ff4757';
                    ctx.beginPath(); ctx.roundRect(it.x, it.y, it.w, it.h, 6); ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                    ctx.lineWidth = 2.5; ctx.stroke();
                } else if (it.type === 'jager') {
                    if (jagerImg.complete && jagerImg.naturalWidth !== 0) {
                        ctx.drawImage(jagerImg, it.x, it.y, it.w, it.h);
                    } else {
                        ctx.fillStyle = '#1b4528';
                        ctx.fillRect(it.x + 6, it.y + 15, it.w - 12, it.h - 15);
                        ctx.fillStyle = '#e67e22';
                        ctx.fillRect(it.x + 8, it.y + 25, it.w - 16, 18);
                    }
                }
            });
