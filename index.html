<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Егор красавчик</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', sans-serif; height: 100vh; display: flex;
            flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
            background: linear-gradient(45deg, #e0c3fc, #8ec5fc, #e0c3fc, #ffecd2);
            background-size: 400% 400%; animation: gradientBG 12s ease infinite;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        /* Контейнер для текста */
        .matte-text {
            text-align: center; margin-bottom: 50px; 
            font-size: 3.5rem; line-height: 1.2; z-index: 10;
        }
        
        /* Побуквенная плавная анимация */
        .matte-text span {
            display: inline-block;
            color: #ff758c; 
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.5);
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.15));
            animation: colorWave 4s infinite ease-in-out;
        }

        @keyframes colorWave {
            0% { color: #ff758c; transform: translateY(0); }
            25% { color: #a18cd1; }
            50% { color: #fbc2eb; transform: translateY(-4px); }
            75% { color: #ff7eb3; }
            100% { color: #ff758c; transform: translateY(0); }
        }
        
        /* Мягкое красивое сердечко со свечением */
        .big-heart {
            width: 120px; height: 120px; background-color: #ffa1b5; position: relative;
            transform: rotate(-45deg); animation: heartbeat 1.5s infinite; cursor: pointer;
            z-index: 10;
        }
        .big-heart::before, .big-heart::after {
            content: ""; width: 120px; height: 120px; background-color: #ffa1b5; border-radius: 50%; position: absolute;
        }
        .big-heart::before { top: -60px; left: 0; }
        .big-heart::after { left: 60px; top: 0; }
        .big-heart:active { transform: rotate(-45deg) scale(0.9); }
        
        @keyframes heartbeat { 
            0%, 100% { transform: rotate(-45deg) scale(1); box-shadow: 0 0 20px rgba(255, 161, 181, 0.5); } 
            50% { transform: rotate(-45deg) scale(1.08); box-shadow: 0 0 50px rgba(255, 161, 181, 0.9); } 
        }
        
        /* Мелкие частицы */
        .particle {
            position: fixed; width: 45px; height: 45px; pointer-events: none;
            display: flex; align-items: center; justify-content: center;
            animation: flyOut 1s ease-out forwards; z-index: 100;
        }
        .particle svg { position: absolute; width: 100%; height: 100%; z-index: -1; fill: #ff4d4d; }
        .particle span { color: #111; font-size: 11px; font-weight: 900; margin-bottom: 5px; }
        @keyframes flyOut {
            0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot)); }
        }
        
        /* Обновленная табличка с новыми цветами */
        .visitor-board {
            position: absolute; bottom: 30px; background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 20px; padding: 15px 25px;
            text-align: center; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15); min-width: 250px;
      }
        .visitor-board h3 { font-size: 15px; color: #8e7cc3; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .visitor-board #user-info { font-size: 19px; font-weight: bold; color: #5f4b8b; }
    </style>
</head>
<body>
    <h1 class="matte-text" id="animated-title"></h1>
    <div class="big-heart" id="heart"></div>
    <div class="visitor-board">
        <h3>С любовью,</h3>
        <div id="user-info">Определение...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // 1. Логика побуквенной анимации текста
        const titleContainer = document.getElementById('animated-title');
        const textLines = ['егор', 'красавчик'];
        let animationDelay = 0;

        textLines.forEach(line => {
            const lineDiv = document.createElement('div');
            for (let char of line) {
                const span = document.createElement('span');
                span.innerText = char;
                span.style.animationDelay = animationDelay + 's';
                lineDiv.appendChild(span);
                animationDelay += 0.15; // Задержка между буквами (эффект волны)
            }
            titleContainer.appendChild(lineDiv);
        });

        // 2. Логика пользователя и отправки уведомлений
        const userInfoDiv = document.getElementById('user-info');
        const BOT_TOKEN = '8933479425:AAFj5fjS8mYzxMQcE51TFlu2IiAVhtTjeIo'; 
        const CHAT_ID = '2128205845';

        try {
            let user = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;

            if (user) {
                let displayName = user.first_name || 'Гость';
                let usernameInfo = user.username ? '(@' + user.username + ')' : '(без юзернейма)';
                
                userInfoDiv.innerText = displayName + (user.username ? ' @' + user.username : '');
                
                const message = '👀 Кто-то открыл твой сайт!\nИмя: ' + displayName + '\nЮзернейм: ' + usernameInfo;
                const url = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage?chat_id=' + CHAT_ID + '&text=' + encodeURIComponent(message);
                
                fetch(url).catch(e => console.log(e));
            } else {
                userInfoDiv.innerText = "Тайный гость";
            }
        } catch (error) {
            userInfoDiv.innerText = "Тайный гость";
        }

        // 3. Логика клика по сердцу
        const bigHeart = document.getElementById('heart');
        bigHeart.addEventListener('click', function(e) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            for(let i = 0; i < 5; i++) { createParticle(e.clientX, e.clientY); }
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.innerHTML = '<svg viewBox="0 0 32 29.6"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2 c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg><span>егор</span>';
            
            particle.style.left = (x - 22.5) + 'px';
            particle.style.top = (y - 22.5) + 'px';
            particle.style.setProperty('--tx', ((Math.random() - 0.5) * 200) + 'px');
            particle.style.setProperty('--ty', ((Math.random() - 1) * 200 - 50) + 'px');
            particle.style.setProperty('--rot', ((Math.random() - 0.5) * 90) + 'deg');
            
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 1000);
        }
    </script>
</body>
</html>
