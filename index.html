<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Егор красавчик</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Nunito', sans-serif; 
            min-height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: flex-start; 
            overflow-x: hidden; overflow-y: auto;
            background: linear-gradient(45deg, #e0c3fc, #8ec5fc, #e0c3fc, #ffecd2);
            background-size: 400% 400%; animation: gradientBG 12s ease infinite;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        .main-screen {
            width: 100%; min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
        }

        .matte-text {
            text-align: center; margin-bottom: 30px; font-size: 3.5rem; line-height: 1.15; z-index: 10; cursor: pointer; position: relative;
        }
        .matte-text span {
            display: inline-block; color: #ff758c; -webkit-text-stroke: 1px rgba(255, 255, 255, 0.5);
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.15));
            animation: colorWave 4s infinite ease-in-out; animation-delay: var(--d);
        }
        @keyframes colorWave { 0% { color: #ff758c; transform: translateY(0); } 25% { color: #a18cd1; } 50% { color: #fbc2eb; transform: translateY(-4px); } 75% { color: #ff7eb3; } 100% { color: #ff758c; transform: translateY(0); } }
        
        .heart-container {
            width: 320px; height: 220px; cursor: pointer; z-index: 10;
            display: flex; align-items: center; justify-content: center;
            animation: float 3s ease-in-out infinite; filter: drop-shadow(0px 20px 25px rgba(255, 117, 140, 0.4));
        }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-18px); } }
        .heart-container svg { width: 100%; height: 100%; transition: transform 0.1s; pointer-events: none; }
        .heart-container:active svg { transform: scale(0.9); }
        
        .wing-l { transform-origin: 140px 100px; animation: flapLeft 1.5s ease-in-out infinite; }
        .wing-r { transform-origin: 210px 100px; animation: flapRight 1.5s ease-in-out infinite; }
        @keyframes flapLeft { 0%, 100% { transform: rotate(10deg); } 50% { transform: rotate(-25deg); } }
        @keyframes flapRight { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(25deg); } }
        
        .particle {
            position: fixed; width: 48px; height: 48px; pointer-events: none; display: flex; align-items: center; justify-content: center;
            animation: flyOut 1s ease-out forwards; z-index: 100;
        }
        .particle svg { position: absolute; width: 100%; height: 100%; z-index: -1; fill: #ff4d4d; }
        .particle span { color: #111; font-size: 11px; font-weight: 900; margin-bottom: 5px; }
        @keyframes flyOut { 0% { opacity: 1; transform: translate(0, 0) scale(0.5); } 100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot)); } }
        
        .visitor-board {
            position: absolute; bottom: 30px; background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 20px; padding: 15px 25px;
            text-align: center; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15); min-width: 250px;
        }
        .visitor-board h3 { font-size: 15px; color: #8e7cc3; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .visitor-board #user-info { font-size: 19px; font-weight: bold; color: #5f4b8b; }

        /* КНОПКА ОТКРЫТИЯ ПЛЕЙЛИСТА (ВНИЗУ СТРАНИЦЫ) */
        #playlist-section { width: 100%; padding: 20px; display: flex; justify-content: center; align-items: center; margin-bottom: 50px; }
        #playlist-open-btn {
            width: 100%; max-width: 500px; display: block; border-radius: 20px; overflow: hidden; cursor: pointer;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25); transition: transform 0.2s ease;
        }
        #playlist-open-btn:active { transform: scale(0.96); }
        #playlist-img { width: 100%; height: auto; display: block; }

        /* ОКНО ПЛЕЙЛИСТА */
        #playlist-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 15, 25, 0.95); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 1000; display: none; flex-direction: column; align-items: center; padding: 20px;
        }
        .playlist-header {
            width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; margin-top: 10px;
        }
        .playlist-header h2 { color: #fff; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
        .close-playlist-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 10px 20px; border-radius: 14px; font-weight: 800; font-size: 16px; cursor: pointer;
        }
        
        .track-list-container {
            width: 100%; max-width: 500px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-bottom: 20px;
        }
        .track-item {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 20px; display: flex; align-items: center; cursor: pointer;
            transition: all 0.2s ease;
        }
        .track-item:active { transform: scale(0.98); }
        .track-icon {
            width: 50px; height: 50px; border-radius: 12px; background: linear-gradient(45deg, #a18cd1, #fbc2eb);
            display: flex; align-items: center; justify-content: center; font-size: 24px; margin-right: 15px;
        }
        .track-info { flex: 1; display: flex; flex-direction: column; }
        .track-name { color: #fff; font-size: 18px; font-weight: 800; margin-bottom: 4px; }
        .track-artist { color: rgba(255, 255, 255, 0.5); font-size: 14px; font-weight: 600; text-transform: uppercase; }
        
        /* Стили для активного (играющего) трека */
        .track-item.playing {
            background: rgba(0, 242, 254, 0.15); border: 1px solid rgba(0, 242, 254, 0.5);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
        }
        .track-item.playing .track-icon {
            background: linear-gradient(45deg, #00f2fe, #4facfe); animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(0, 242, 254, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); } }

        /* ИГРА */
        #game-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .game-ui { width: 95%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-weight: 900; color: #fff; }
        #score-display { background: rgba(255, 255, 255, 0.1); padding: 12px 24px; border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 20px rgba(0,0,0,0.4); font-size: 22px; }
        .close-game-btn { background: linear-gradient(45deg, #ff4757, #ff6b81); color: #fff; border: none; border-radius: 16px; padding: 12px 24px; font-weight: 900; cursor: pointer; font-size: 18px; box-shadow: 0 4px 15px rgba(255, 71, 87, 0.5); text-transform: uppercase; }
        #game-canvas { background: #fff; border-radius: 24px; box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.1); width: 96vw; max-width: 500px; height: auto; aspect-ratio: 2 / 3; }
        #win-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1001; animation: fadeIn 0.4s ease; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .winner-card { background: linear-gradient(135deg, #1e1e24, #15151a); border-radius: 28px; padding: 30px; text-align: center; max-width: 420px; width: 90%; box-shadow: 0 20px 80px rgba(243, 156, 18, 0.5); border: 3px solid rgba(241, 196, 15, 0.6); position: relative; }
        .winner-card::before { content: ''; position: absolute; top: -3px; left: -3px; right: -3px; bottom: -3px; background: linear-gradient(45deg, #f1c40f, #e67e22, #f39c12); z-index: -1; border-radius: 30px; filter: blur(12px); opacity: 0.8; }
        .winner-card img { width: 100%; height: auto; max-height: 280px; object-fit: contain; border-radius: 20px; margin-bottom: 25px; }
        .win-btn-row { display: flex; gap: 15px; justify-content: center; }
        .win-btn { background: linear-gradient(45deg, #2ecc71, #27ae60); color: #fff; border: none; border-radius: 14px; padding: 16px 26px; font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 20px rgba(46, 204, 113, 0.5); text-transform: uppercase; }
        .exit-btn { background: linear-gradient(45deg, #57606f, #2f3542); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body>

    <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>
    <audio id="playlist-audio" preload="auto"></audio>

    <div class="main-screen">
        <h1 class="matte-text" id="magic-text">
            <div><span style="--d: 0s">е</span><span style="--d: 0.15s">г</span><span style="--d: 0.3s">о</span><span style="--d: 0.45s">р</span></div>
            <div><span style="--d: 0.6s">к</span><span style="--d: 0.75s">р</span><span style="--d: 0.9s">а</span><span style="--d: 1.05s">с</span><span style="--d: 1.2s">а</span><span style="--d: 1.35s">в</span><span style="--d: 1.5s">ч</span><span style="--d: 1.65s">и</span><span style="--d: 1.8s">к</span></div>
        </h1>
        
        <div class="heart-container" id="heart">
            <svg viewBox="0 0 350 250" xmlns="http://www.w3.org/2000/svg">
                <g class="wing-l"><path d="M 140 100 C 80 20, 10 40, 25 80 C 5 95, 10 135, 45 130 C 30 155, 60 180, 95 155 C 120 135, 130 110, 140 100 Z" fill="#ffffff" stroke="#111" stroke-width="10" stroke-linejoin="round"/><path d="M 50 85 C 80 85, 110 95, 130 105" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/><path d="M 60 120 C 90 115, 110 110, 125 110" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/></g>
                <g class="wing-r"><path d="M 210 100 C 270 20, 340 40, 325 80 C 345 95, 340 135, 305 130 C 320 155, 290 180, 255 155 C 230 135, 220 110, 210 100 Z" fill="#ffffff" stroke="#111" stroke-width="10" stroke-linejoin="round"/><path d="M 300 85 C 270 85, 240 95, 220 105" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/><path d="M 290 120 C 260 115, 240 110, 225 110" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/></g>
                <g><path d="M 175 210 C 175 210, 60 120, 70 60 C 75 20, 130 10, 175 55 C 220 10, 275 20, 280 60 C 290 120, 175 210, 175 210 Z" fill="#ff7eb3" stroke="#111" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/><path d="M 100 60 C 100 40, 130 30, 150 45" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/></g>
            </svg>
        </div>

        <div class="visitor-board">
            <h3>ПРИВЕТСТВУЮ ТЕБЯ,</h3>
            <div id="user-info">Загрузка...</div>
        </div>
    </div>

    <div id="playlist-section">
        <div id="playlist-open-btn">
            <img src="playlist.jpg" id="playlist-img" alt="Плейлист CUPSIZE" onerror="this.src='https://via.placeholder.com/600x200?text=Нажми+чтобы+открыть+плеер'">
        </div>
    </div>

    <div id="playlist-modal">
        <div class="playlist-header">
            <h2>🎧 Плейлист</h2>
            <button class="close-playlist-btn" id="close-playlist-btn">Свернуть</button>
        </div>
        <div class="track-list-container" id="track-list">
            </div>
    </div>

    <div id="game-modal">
        <div class="game-ui">
            <div id="score-display">🍾 Егерь: 0/100</div>
            <button class="close-game-btn" id="close-game-btn">✕ В меню</button>
        </div>
        <canvas id="game-canvas" width="500" height="750"></canvas>
        <p style="margin-top: 25px; color: rgba(255,255,255,0.8); font-size: 18px; text-transform: uppercase; letter-spacing: 2px; font-weight: 900;">Тапай для прыжка (можно 2 раза!)</p>
        <div id="win-screen">
            <div class="winner-card">
                <img src="win.jpg" alt="Егорка доволен">
                <div class="win-btn-row">
                    <button class="win-btn" id="win-restart-btn">Ещё раз</button>
                    <button class="win-btn exit-btn" id="win-exit-btn">В меню</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        const userInfoDiv = document.getElementById('user-info');
        const BOT_TOKEN = '8933479425:AAFj5fjS8mYzxMQcE51TFlu2IiAVhtTjeIo'; 
        const CHAT_ID = '2128205845';

        try {
            let user = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
            if (user) {
                let displayName = user.first_name || '';
                let usernameDisplay = user.username ? '@' + user.username : '';
                userInfoDiv.innerText = displayName + (usernameDisplay ? ' ' + usernameDisplay : '') || 'Гость';
                fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage?chat_id=' + CHAT_ID + '&text=' + encodeURIComponent('👀 Кто-то открыл твой сайт!\nИмя: ' + (displayName||'Нет') + '\nЮзернейм: ' + (usernameDisplay||'Нет'))).catch(()=>{});
            } else { userInfoDiv.innerText = "Гость"; }
        } catch (e) { userInfoDiv.innerText = "Гость"; }

        // ===================================
        // ЛОГИКА ПЛЕЙЛИСТА И МУЗЫКИ
        // ===================================
        const bgMusic = document.getElementById('bg-music');
        const playlistAudio = document.getElementById('playlist-audio');
        const magicText = document.getElementById('magic-text');
        
        // ВАЖНО: Список твоих 5 треков
        const myTracks = [
            { title: "Любимый трек 1", artist: "CUPSIZE", file: "track1.mp3" },
            { title: "Любимый трек 2", artist: "CUPSIZE", file: "track2.mp3" },
            { title: "Любимый трек 3", artist: "CUPSIZE", file: "track3.mp3" },
            { title: "Любимый трек 4", artist: "CUPSIZE", file: "track4.mp3" },
            { title: "Любимый трек 5", artist: "CUPSIZE", file: "track5.mp3" }
        ];

        let currentTrackIndex = -1;
        let trackElements = [];

        // Главная музыка (по клику на текст)
        magicText.addEventListener('click', function() {
            if (bgMusic.paused) {
                playlistAudio.pause(); // Тормозим плеер, если он играл
                updatePlaylistUI();    // Сбрасываем анимацию плеера
                bgMusic.volume = 0.3;
                bgMusic.play().catch(()=>{});
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            } else {
                bgMusic.pause();
            }
        });

        // Открытие и закрытие окна плеера
        const playlistModal = document.getElementById('playlist-modal');
        document.getElementById('playlist-open-btn').addEventListener('click', () => {
            playlistModal.style.display = 'flex';
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        });
        document.getElementById('close-playlist-btn').addEventListener('click', () => {
            playlistModal.style.display = 'none';
        });

        // Создаем кнопки для треков
        const trackListContainer = document.getElementById('track-list');
        myTracks.forEach((track, index) => {
            const el = document.createElement('div');
            el.className = 'track-item';
            el.innerHTML = `
                <div class="track-icon">🎵</div>
                <div class="track-info">
                    <div class="track-name">${track.title}</div>
                    <div class="track-artist">${track.artist}</div>
                </div>
            `;
            el.addEventListener('click', () => playTrack(index));
            trackElements.push(el);
            trackListContainer.appendChild(el);
        });

        function playTrack(index) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            
            // Если играет главная музыка - ставим на паузу
            if (!bgMusic.paused) bgMusic.pause();

            // Если кликнули на тот же трек, который сейчас играет
            if (currentTrackIndex === index) {
                if (playlistAudio.paused) {
                    playlistAudio.play();
                } else {
                    playlistAudio.pause();
                }
            } else {
                // Если включили новый трек
                currentTrackIndex = index;
                playlistAudio.src = myTracks[index].file;
                playlistAudio.volume = 0.6;
                playlistAudio.play().catch(()=>{});
            }
            updatePlaylistUI();
        }

        function updatePlaylistUI() {
            trackElements.forEach((el, i) => {
                if (i === currentTrackIndex && !playlistAudio.paused) {
                    el.classList.add('playing');
                    el.querySelector('.track-icon').innerText = '⏸'; // Иконка паузы
                } else {
                    el.classList.remove('playing');
                    el.querySelector('.track-icon').innerText = '🎵';
                }
            });
        }
        
        // Когда трек заканчивается - убираем анимацию
        playlistAudio.addEventListener('ended', () => {
            updatePlaylistUI();
        });


        // ===================================
        // АКТИВАЦИЯ ИГРЫ (СЕРДЦЕ)
        // ===================================
        const bigHeart = document.getElementById('heart');
        let heartClicks = 0; let heartTimer = null;

        bigHeart.addEventListener('click', function(e) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            let x = e.clientX || (bigHeart.getBoundingClientRect().left + 160);
            let y = e.clientY || (bigHeart.getBoundingClientRect().top + 110);
            for(let i = 0; i < 5; i++) { createParticle(x, y); }

            heartClicks++;
            clearTimeout(heartTimer);
            heartTimer = setTimeout(() => { heartClicks = 0; }, 1800);

            if (heartClicks >= 5) {
                heartClicks = 0;
                // При входе в игру глушим всю музыку
                bgMusic.pause();
                playlistAudio.pause();
                updatePlaylistUI();
                openGame();
            }
        });

        function createParticle(x, y) {
            const particle = document.createElement('div'); particle.classList.add('particle');
            particle.innerHTML = '<svg viewBox="0 0 32 29.6"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2 c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg><span>егор</span>';
            particle.style.left = (x - 24) + 'px'; particle.style.top = (y - 24) + 'px';
            particle.style.setProperty('--tx', ((Math.random() - 0.5) * 220) + 'px');
            particle.style.setProperty('--ty', ((Math.random() - 1) * 200 - 50) + 'px');
            particle.style.setProperty('--rot', ((Math.random() - 0.5) * 90) + 'deg');
            document.body.appendChild(particle); setTimeout(() => { particle.remove(); }, 1000);
        }

        // ===================================
        // ГЕЙМПЛЕЙ ИГРЫ
        // ===================================
        const modal = document.getElementById('game-modal');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const winScreen = document.getElementById('win-screen');
        const closeBtn = document.getElementById('close-game-btn');
        const restartBtn = document.getElementById('win-restart-btn');
        const exitWinBtn = document.getElementById('win-exit-btn');

        const playerImg = new Image(); playerImg.src = 'player.png';
        const jagerImg = new Image(); jagerImg.src = 'jager.png';

        let isRunning = false; let score = 0; let animationFrameId = null;

        let player = { x: 60, y: 410, w: 100, h: 140, vy: 0, gravity: 0.4, jumpForce: -13.5, isGrounded: false, jumpCount: 0, maxJumps: 2 };
        let items = []; let spawnTimer = 0; let bgOffset = 0;

        function openGame() { modal.style.display = 'flex'; resetGame(); }
        function closeGame() { modal.style.display = 'none'; winScreen.style.display = 'none'; isRunning = false; cancelAnimationFrame(animationFrameId); }

        closeBtn.addEventListener('click', closeGame);
        exitWinBtn.addEventListener('click', closeGame);
        restartBtn.addEventListener('click', () => { winScreen.style.display = 'none'; resetGame(); });

        function resetGame() {
            score = 0; scoreDisplay.innerText = '🍾 Егерь: 0/100'; player.y = 410; player.vy = 0; player.jumpCount = 0; 
            items = []; spawnTimer = 0; bgOffset = 0; winScreen.style.display = 'none'; isRunning = true;
            cancelAnimationFrame(animationFrameId); gameLoop();
        }

        function doJump() {
            if (!isRunning) return;
            if (player.isGrounded || player.jumpCount < player.maxJumps) {
                player.vy = player.jumpForce; player.isGrounded = false; player.jumpCount++;
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            }
        }

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); doJump(); });
        canvas.addEventListener('mousedown', doJump);
        window.addEventListener('keydown', (e) => { if (e.code === 'Space') doJump(); });

        function playVictorySound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + idx * 0.12 + 0.6);
                    osc.start(audioCtx.currentTime + idx * 0.12); osc.stop(audioCtx.currentTime + idx * 0.12 + 0.6);
                });
            } catch(e){}
        }

        function gameLoop() {
            if (!isRunning) return;
            update(); draw(); animationFrameId = requestAnimationFrame(gameLoop);
        }

        function update() {
            bgOffset = (bgOffset + 1.0) % 500; 
            player.vy += player.gravity; player.y += player.vy;
            if (player.y >= 410) { player.y = 410; player.vy = 0; player.isGrounded = true; player.jumpCount = 0; }

            spawnTimer++;
            if (spawnTimer % 110 === 0) {
                if (Math.random() < 0.4) { items.push({ type: 'obstacle', x: 550, y: 515, w: 25, h: 35 }); } 
                else { items.push({ type: 'jager', x: 550, y: (Math.random() < 0.5 ? 280 : 430), w: 45, h: 110, collected: false }); }
            }

            for (let i = items.length - 1; i >= 0; i--) {
                const it = items[i]; it.x -= 3.8; 
                if (checkCollide(player, it)) {
                    if (it.type === 'obstacle') {
                        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                        resetGame(); return;
                    } else if (it.type === 'jager' && !it.collected) {
                        it.collected = true; score += 10; scoreDisplay.innerText = '🍾 Егерь: ' + score + '/100';
                        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                        items.splice(i, 1);
                        if (score >= 100) { isRunning = false; playVictorySound(); winScreen.style.display = 'flex'; return; }
                        continue;
                    }
                }
                if (it.x < -100) items.splice(i, 1);
            }
        }

        function checkCollide(p, it) {
            const padX = it.type === 'obstacle' ? 5 : 15; const padY = 10; 
            return (p.x + padX) < (it.x + it.w) && (p.x + p.w - padX) > it.x && (p.y + padY) < (it.y + it.h) && (p.y + p.h) > it.y;
        }

        function drawBackground() {
            const skyGrad = ctx.createLinearGradient(0, 0, 0, 550);
            skyGrad.addColorStop(0, '#191b2a'); skyGrad.addColorStop(0.6, '#2d1b4e'); skyGrad.addColorStop(1, '#ff758c');
            ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, canvas.width, 550);

            ctx.shadowColor = '#fff6d6'; ctx.shadowBlur = 25; ctx.fillStyle = '#fff6d6';
            ctx.beginPath(); ctx.arc(400, 100, 35, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;

            const mountainGrad = ctx.createLinearGradient(0, 300, 0, 550);
            mountainGrad.addColorStop(0, '#2a1b4e'); mountainGrad.addColorStop(1, '#150d26');
            ctx.fillStyle = mountainGrad; ctx.beginPath(); ctx.moveTo(0, 550);
            for (let x = 0; x <= canvas.width + 100; x += 100) {
                ctx.lineTo((x - (bgOffset * 0.4)) % (canvas.width + 100), 350 + Math.sin(x * 0.05) * 80);
            }
            ctx.lineTo(canvas.width, 550); ctx.closePath(); ctx.fill();

            const hillGrad = ctx.createLinearGradient(0, 400, 0, 550);
            hillGrad.addColorStop(0, '#1c1132'); hillGrad.addColorStop(1, '#0a0612');
            ctx.fillStyle = hillGrad; ctx.beginPath(); ctx.moveTo(0, 550);
            for (let x = 0; x <= canvas.width + 80; x += 80) {
                ctx.lineTo((x - (bgOffset * 0.8)) % (canvas.width + 80), 450 + Math.cos(x * 0.08) * 50);
            }
            ctx.lineTo(canvas.width, 550); ctx.closePath(); ctx.fill();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); drawBackground();
            ctx.fillStyle = '#11131a'; ctx.fillRect(0, 550, canvas.width, 200);
            ctx.shadowColor = '#00f2fe'; ctx.shadowBlur = 15; ctx.fillStyle = '#00f2fe';
            ctx.fillRect(0, 550, canvas.width, 6); ctx.shadowBlur = 0;

            ctx.save(); ctx.translate(player.x, player.y);
            if (playerImg.complete && playerImg.naturalWidth !== 0) {
                if (player.isGrounded) ctx.rotate(Math.sin(Date.now() / 200) * 0.08);
                ctx.drawImage(playerImg, 0, 0, player.w, player.h);
            } else {
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.beginPath(); ctx.arc(50, 30, 22, 0, Math.PI*2); ctx.moveTo(50, 52); ctx.lineTo(50, 90);
                ctx.moveTo(50, 65); ctx.lineTo(25, 80); ctx.moveTo(50, 65); ctx.lineTo(75, 80);
                if (player.isGrounded) {
                    const legAnim = Math.sin(Date.now() / 150) * 18;
                    ctx.moveTo(50, 90); ctx.lineTo(30 + legAnim, 130); ctx.moveTo(50, 90); ctx.lineTo(70 - legAnim, 130);
                } else {
                    ctx.moveTo(50, 90); ctx.lineTo(30, 115); ctx.moveTo(50, 90); ctx.lineTo(70, 125);
                }
                ctx.stroke();
            }
            ctx.restore();

            items.forEach(it => {
                if (it.type === 'obstacle') {
                    ctx.fillStyle = '#ff4757'; ctx.beginPath(); ctx.roundRect(it.x, it.y, it.w, it.h, 4); ctx.fill();
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; ctx.stroke();
                } else if (it.type === 'jager') {
                    if (jagerImg.complete && jagerImg.naturalWidth !== 0) {
                        ctx.drawImage(jagerImg, it.x, it.y, it.w, it.h);
                    } else {
                        ctx.fillStyle = '#1b4528'; ctx.fillRect(it.x + 5, it.y + 20, it.w - 10, it.h - 20);
                        ctx.fillStyle = '#e67e22'; ctx.fillRect(it.x + 8, it.y + 35, it.w - 16, 25);
                    }
                }
            });
        }
    </script>
